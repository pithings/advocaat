<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Jev's personality test</title>
  <desc id="description">Jungian type indicator (32 items) (INTP): introverted, intuitive, thinking, perceiving. IPIP Big-Five Factor Markers (50 items): socially mixed, selectively accommodating, moderately structured, mixed reactivity, mixed abstract focus. Model self-report, not measured behavior or a validated assessment.</desc>
